{% extends "base.html" %}
{% block title %}Anotacoes{% endblock %}
{% block content %}
<h1>Anotacoes</h1>
<p class="subtitulo">Capture ideias, resumos e lembretes com suporte a markdown</p>

<div class="notas-layout">
  <div class="notas-sidebar" id="notas-sidebar">
    <h3>
      Minhas Notas
      <button class="btn-nova-nota" onclick="novaNota()">+ Nova</button>
    </h3>
    <div id="notas-lista"></div>
  </div>
  <div class="notas-editor" id="notas-editor">
    <p style="color:var(--text2);text-align:center;padding-top:80px">Selecione ou crie uma nota</p>
  </div>
</div>

<script>
var notas = JSON.parse(localStorage.getItem('ia-notas') || '[]');
var notaAtiva = null;

if (notas.length === 0) {
  notas = [
    {id:'n1',title:'Ideias para projeto de NLP',content:'# Ideias para Projeto de NLP\n\n- Analisador de sentimentos para reviews\n- Sumarizador de documentos juridicos\n- Chatbot com RAG',criado:new Date().toISOString(),atualizado:new Date().toISOString()},
    {id:'n2',title:'Resumo: Etica em IA',content:'# Etica em IA\n\n## Pontos principais\n\n- Vieses nos dados sao a principal fonte de discriminacao\n- Transparencia e explicabilidade sao direitos fundamentais\n- LGPD se aplica a modelos que processam dados pessoais',criado:new Date().toISOString(),atualizado:new Date().toISOString()},
    {id:'n3',title:'Ferramentas para testar',content:'# Ferramentas para Testar\n\n- [ ] LangChain\n- [ ] ChromaDB\n- [ ] Ollama\n- [ ] CrewAI',criado:new Date().toISOString(),atualizado:new Date().toISOString()},
  ];
  localStorage.setItem('ia-notas', JSON.stringify(notas));
}

function salvar() {
  localStorage.setItem('ia-notas', JSON.stringify(notas));
}

function novaNota() {
  var id = 'n' + Date.now();
  var nota = {id:id, title:'Nova nota', content:'', criado:new Date().toISOString(), atualizado:new Date().toISOString()};
  notas.unshift(nota);
  salvar();
  selecionarNota(id);
}

function selecionarNota(id) {
  notaAtiva = id;
  renderizarLista();
  renderizarEditor();
}

function excluirNota(id) {
  if (!confirm('Excluir esta nota?')) return;
  notas = notas.filter(function(n) { return n.id !== id; });
  salvar();
  if (notaAtiva === id) notaAtiva = null;
  renderizarLista();
  renderizarEditor();
}

function atualizarNota() {
  var n = notas.find(function(x) { return x.id === notaAtiva; });
  if (!n) return;
  n.title = document.getElementById('nota-titulo').value;
  n.content = document.getElementById('nota-conteudo').value;
  n.atualizado = new Date().toISOString();
  salvar();
  renderizarLista();
}

function renderizarLista() {
  var html = '';
  notas.forEach(function(n) {
    var ativo = n.id === notaAtiva ? ' active' : '';
    var preview = n.content.split('\n')[0].replace(/^#+\s*/,'').substring(0,60) || 'Nota vazia';
    var data = new Date(n.atualizado).toLocaleDateString('pt-BR');
    html += '<div class="nota-item' + ativo + '" onclick="selecionarNota(\'' + n.id + '\')">';
    html += '<div class="nota-titulo">' + escapar(n.title) + '</div>';
    html += '<div class="nota-preview">' + escapar(preview) + '</div>';
    html += '<div class="nota-data">' + data + ' <span onclick="event.stopPropagation();excluirNota(\'' + n.id + '\')" style="color:var(--danger);cursor:pointer;float:right">x</span></div>';
    html += '</div>';
  });
  document.getElementById('notas-lista').innerHTML = html || '<p style="color:var(--text2);font-size:.85rem;text-align:center;padding:20px">Nenhuma nota</p>';
}

function renderizarEditor() {
  var n = notas.find(function(x) { return x.id === notaAtiva; });
  if (!n) {
    document.getElementById('notas-editor').innerHTML = '<p style="color:var(--text2);text-align:center;padding-top:80px">Selecione ou crie uma nota</p>';
    return;
  }
  var data = new Date(n.atualizado).toLocaleString('pt-BR');
  var html = '';
  html += '<div class="tabs"><button class="tab-btn active" onclick="mudarTab(\'escrever\',this)">Escrever</button><button class="tab-btn" onclick="mudarTab(\'visualizar\',this)">Visualizar</button></div>';
  html += '<div id="tab-escrever">';
  html += '<input class="notas-input-titulo" id="nota-titulo" value="' + attr(n.title) + '" placeholder="Titulo da nota..." onchange="atualizarNota()">';
  html += '<textarea class="notas-textarea" id="nota-conteudo" placeholder="Comece a escrever..." onchange="atualizarNota()">' + escapar(n.content) + '</textarea>';
  html += '</div>';
  html += '<div id="tab-visualizar" style="display:none"><div class="notas-preview">' + renderMarkdown(n.content) + '</div></div>';
  html += '<div style="font-size:.75rem;color:var(--text2);padding-top:8px;border-top:1px solid var(--border);margin-top:16px">Ultima edicao: ' + data + '</div>';
  document.getElementById('notas-editor').innerHTML = html;
}

function mudarTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-escrever').style.display = tab === 'escrever' ? '' : 'none';
  document.getElementById('tab-visualizar').style.display = tab === 'visualizar' ? '' : 'none';
}

function renderMarkdown(text) {
  if (!text) return '';
  var lines = text.split('\n');
  var html = '';
  var inList = false;
  lines.forEach(function(line) {
    var trimmed = line.trim();
    if (trimmed === '') { if (inList) { html += '</ul>'; inList = false; } html += '<br>'; }
    else if (trimmed.startsWith('# ')) { if (inList) { html += '</ul>'; inList = false; } html += '<h1>' + escapar(trimmed.substring(2)) + '</h1>'; }
    else if (trimmed.startsWith('## ')) { if (inList) { html += '</ul>'; inList = false; } html += '<h2>' + escapar(trimmed.substring(3)) + '</h2>'; }
    else if (trimmed.startsWith('- ')) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + escapar(trimmed.substring(2)) + '</li>'; }
    else { if (inList) { html += '</ul>'; inList = false; } html += '<p>' + escapar(trimmed) + '</p>'; }
  });
  if (inList) html += '</ul>';
  return html;
}

function escapar(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function attr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderizarLista();
if (notas.length > 0 && !notaAtiva) selecionarNota(notas[0].id);
</script>
{% endblock %}
