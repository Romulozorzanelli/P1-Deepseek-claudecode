<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IA para Iniciantes{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

        :root {
            --bg: #f8fafc;
            --surface: #fff;
            --text: #0f172a;
            --text2: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-subtle: #eef2ff;
            --success: #059669;
            --success-subtle: #ecfdf5;
            --danger: #dc2626;
            --danger-subtle: #fef2f2;
            --shadow: 0 1px 3px rgba(0,0,0,.08);
            --shadow-hover: 0 4px 16px rgba(0,0,0,.12);
            --radius: 10px;
            --radius-sm: 6px;
        }

        [data-theme="dark"] {
            --bg: #0b1120;
            --surface: #1e293b;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #334155;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --primary-subtle: #1e1b4b;
            --success: #34d399;
            --success-subtle: #022c22;
            --danger: #f87171;
            --danger-subtle: #450a0a;
            --shadow: 0 1px 3px rgba(0,0,0,.3);
            --shadow-hover: 0 4px 16px rgba(0,0,0,.5);
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.7;
            transition: background .2s, color .2s;
        }

        .container{max-width:960px;margin:0 auto;padding:0 20px}

        /* Header */
        .site-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background .2s, border-color .2s;
        }
        .site-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-left{display:flex;align-items:center;gap:14px}
        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -.01em;
        }
        .logo:hover{color:var(--primary-hover)}

        /* Theme toggle */
        #theme-toggle {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text2);
            transition: border-color .2s, color .2s, background .2s;
        }
        #theme-toggle:hover{color:var(--primary);border-color:var(--primary)}
        #theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .icon-sun{display:none}
        .icon-moon{display:block}
        [data-theme="dark"] .icon-sun{display:block}
        [data-theme="dark"] .icon-moon{display:none}

        /* Nav */
        .site-nav{display:flex;gap:18px;flex-wrap:wrap}
        .site-nav a {
            text-decoration: none;
            color: var(--text2);
            font-size: .88rem;
            font-weight: 500;
            transition: color .15s;
            letter-spacing: -.01em;
        }
        .site-nav a:hover{color:var(--primary)}

        /* Breadcrumb */
        .breadcrumb{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 0;transition: background .2s,border-color .2s}
        .breadcrumb a{color:var(--primary);text-decoration:none;font-size:.85rem}
        .breadcrumb a:hover{text-decoration:underline}
        .breadcrumb .separator{margin:0 8px;color:var(--text2)}
        .breadcrumb span{font-size:.85rem;color:var(--text2)}

        /* Main */
        .site-main{padding:40px 0;min-height:60vh}

        /* Footer */
        .site-footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 24px 0;
            text-align: center;
            color: var(--text2);
            font-size: .85rem;
            transition: background .2s,border-color .2s;
        }

        /* Hero */
        .hero{text-align:center;padding:50px 0 40px}
        .hero h1{font-size:2.4rem;color:var(--text);margin-bottom:12px;letter-spacing:-.02em;font-weight:700}
        .hero p{font-size:1.15rem;color:var(--text2);max-width:600px;margin:0 auto 30px;line-height:1.7}

        /* Cards grid */
        .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:20px}
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            text-decoration: none;
            color: var(--text);
            transition: box-shadow .2s, transform .2s, border-color .2s, background .2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 3px solid var(--primary);
        }
        .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--primary)}
        .card h2{font-size:1.1rem;color:var(--text);font-weight:600;letter-spacing:-.01em}
        .card p{font-size:.9rem;color:var(--text2);line-height:1.6}

        /* Content pages */
        .pagina-conteudo h1{font-size:2rem;margin-bottom:8px;font-weight:700;letter-spacing:-.02em}
        .pagina-conteudo .subtitulo{color:var(--text2);font-size:1.05rem;margin-bottom:30px}
        .pagina-conteudo h2{font-size:1.35rem;margin-top:36px;margin-bottom:12px;color:var(--primary);font-weight:600}
        .pagina-conteudo h3{font-size:1.1rem;margin-top:20px;margin-bottom:8px;font-weight:600}
        .pagina-conteudo p{margin-bottom:14px}
        .pagina-conteudo ul,.pagina-conteudo ol{margin-bottom:16px;padding-left:22px}
        .pagina-conteudo li{margin-bottom:6px}

        /* Highlight box */
        .destaque {
            background: var(--primary-subtle);
            border-left: 4px solid var(--primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 16px 20px;
            margin: 24px 0;
            transition: background .2s;
        }

        /* Mitos grid */
        .mitos-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
        .mito-card,.verdade-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition: background .2s,border-color .2s}
        .mito-card{border-left:4px solid var(--danger)}
        .mito-card .rotulo{color:var(--danger);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        .verdade-card{border-left:4px solid var(--success)}
        .verdade-card .rotulo{color:var(--success);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

        /* Timeline */
        .linha-do-tempo{margin:24px 0}
        .evento{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--border);align-items:start}
        .evento .ano{font-weight:700;color:var(--primary);font-size:.95rem}
        .evento .descricao{font-size:.95rem}

        /* IAs grid */
        .ias-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin:24px 0}
        .ia-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition: background .2s,border-color .2s}
        .ia-card h3{margin-top:0;font-size:1.15rem;font-weight:600}
        .ia-card .criador{color:var(--text2);font-size:.85rem;margin-bottom:10px}
        .ia-card .uso{font-size:.9rem;margin-bottom:10px}
        .ia-card .preco{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--primary-subtle);color:var(--primary)}

        /* Tabela */
        .tabela-comparativa{width:100%;border-collapse:collapse;margin:24px 0;font-size:.9rem}
        .tabela-comparativa th,.tabela-comparativa td{border:1px solid var(--border);padding:10px 14px;text-align:left;transition: border-color .2s}
        .tabela-comparativa th{background:var(--primary-subtle);color:var(--primary);font-weight:600}
        .tabela-comparativa tr:nth-child(even) td{background:var(--bg)}

        /* Dicas grid (tools) */
        .dicas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:24px 0}
        .dica-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition: background .2s,border-color .2s}
        .dica-card h3{font-size:1rem;margin-top:0;font-weight:600}
        .dica-card p{font-size:.85rem;color:var(--text2);margin-bottom:0}

        /* Habilidades grid */
        .habilidades-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:24px 0}
        .habilidade-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition: background .2s,border-color .2s}
        .habilidade-card h3{margin-top:0;font-size:1.05rem;font-weight:600}
        .habilidade-card p{font-size:.9rem;color:var(--text2);margin-bottom:0}

        /* Button */
        .btn-voltar {
            display:inline-block;
            margin-top:30px;
            padding:10px 22px;
            background:var(--primary);
            color:#fff;
            text-decoration:none;
            border-radius:var(--radius-sm);
            font-weight:500;
            font-size:.9rem;
            transition:background .15s;
            letter-spacing:-.01em;
        }
        .btn-voltar:hover{background:var(--primary-hover)}

        @media(max-width:640px){
            .hero h1{font-size:1.7rem}
            .mitos-grid{grid-template-columns:1fr}
            .evento{grid-template-columns:1fr;gap:4px}
            .site-header .container{flex-direction:column}
            .header-left{width:100%;justify-content:space-between}
            .site-nav{justify-content:center}
            .tabela-comparativa{font-size:.8rem}
            .tabela-comparativa th,.tabela-comparativa td{padding:6px 8px}
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-left">
                <a href="/" class="logo">IA para Iniciantes</a>
                <button id="theme-toggle" aria-label="Alternar tema" title="Alternar entre modo claro e escuro">
                    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
            <nav class="site-nav">
                <a href="/o-que-e-ia">O que e IA</a>
                <a href="/mitos-e-verdades">Mitos e Verdades</a>
                <a href="/ia-como-ferramenta">IA como Ferramenta</a>
                <a href="/ias-famosas">IAs Famosas</a>
                <a href="/ia-mercado-trabalho">IA no Mercado</a>
            </nav>
        </div>
    </header>

    {% if breadcrumb %}
    <nav class="breadcrumb">
        <div class="container">
            <a href="/">Inicio</a>
            <span class="separator">&rsaquo;</span>
            <span>{{ breadcrumb }}</span>
        </div>
    </nav>
    {% endif %}

    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>IA para Iniciantes &mdash; Conteudo educativo e gratuito para quem quer comecar a entender Inteligencia Artificial.</p>
        </div>
    </footer>

    <script>
        (function() {
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = stored || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);

            var btn = document.getElementById('theme-toggle');
            btn.addEventListener('click', function() {
                var current = document.documentElement.getAttribute('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        })();
    </script>
</body>
</html>
