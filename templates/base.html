<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IA para Iniciantes{% endblock %}</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cor-primaria:#2563eb;--cor-primaria-escura:#1d4ed8;--cor-primaria-clara:#dbeafe;--cor-fundo:#f8fafc;--cor-texto:#1e293b;--cor-texto-suave:#64748b;--cor-borda:#e2e8f0;--cor-branca:#fff;--cor-sucesso:#16a34a;--cor-sucesso-fundo:#dcfce7;--cor-alerta:#ea580c;--cor-alerta-fundo:#fff7ed;--cor-perigo:#dc2626;--cor-perigo-fundo:#fef2f2;--sombra:0 1px 3px rgba(0,0,0,.1);--sombra-hover:0 4px 12px rgba(0,0,0,.15);--raio:8px}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--cor-texto);background:var(--cor-fundo);line-height:1.7}
        .container{max-width:960px;margin:0 auto;padding:0 20px}
        .site-header{background:var(--cor-branca);border-bottom:1px solid var(--cor-borda);padding:14px 0;position:sticky;top:0;z-index:10}
        .site-header .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .logo{font-weight:700;font-size:1.15rem;color:var(--cor-primaria);text-decoration:none}
        .logo:hover{color:var(--cor-primaria-escura)}
        .site-nav{display:flex;gap:18px;flex-wrap:wrap}
        .site-nav a{text-decoration:none;color:var(--cor-texto-suave);font-size:.9rem;font-weight:500;transition:color .15s}
        .site-nav a:hover{color:var(--cor-primaria)}
        .breadcrumb{background:var(--cor-branca);border-bottom:1px solid var(--cor-borda);padding:10px 0}
        .breadcrumb a{color:var(--cor-primaria);text-decoration:none;font-size:.85rem}
        .breadcrumb a:hover{text-decoration:underline}
        .breadcrumb .separator{margin:0 8px;color:var(--cor-texto-suave)}
        .breadcrumb span{font-size:.85rem;color:var(--cor-texto-suave)}
        .site-main{padding:40px 0;min-height:60vh}
        .site-footer{background:var(--cor-branca);border-top:1px solid var(--cor-borda);padding:24px 0;text-align:center;color:var(--cor-texto-suave);font-size:.85rem}
        .hero{text-align:center;padding:50px 0 40px}
        .hero h1{font-size:2.4rem;color:var(--cor-texto);margin-bottom:12px}
        .hero p{font-size:1.15rem;color:var(--cor-texto-suave);max-width:600px;margin:0 auto 30px}
        .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:20px}
        .card{background:var(--cor-branca);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:28px 24px;text-decoration:none;color:var(--cor-texto);transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column;gap:10px}
        .card:hover{box-shadow:var(--sombra-hover);transform:translateY(-2px)}
        .card-icone{font-size:2.2rem}
        .card h2{font-size:1.15rem;color:var(--cor-texto)}
        .card p{font-size:.9rem;color:var(--cor-texto-suave);line-height:1.6}
        .pagina-conteudo h1{font-size:2rem;margin-bottom:8px}
        .pagina-conteudo .subtitulo{color:var(--cor-texto-suave);font-size:1.05rem;margin-bottom:30px}
        .pagina-conteudo h2{font-size:1.4rem;margin-top:36px;margin-bottom:12px;color:var(--cor-primaria)}
        .pagina-conteudo h3{font-size:1.1rem;margin-top:20px;margin-bottom:8px}
        .pagina-conteudo p{margin-bottom:14px}
        .pagina-conteudo ul,.pagina-conteudo ol{margin-bottom:16px;padding-left:22px}
        .pagina-conteudo li{margin-bottom:6px}
        .destaque{background:var(--cor-primaria-clara);border-left:4px solid var(--cor-primaria);border-radius:0 var(--raio) var(--raio) 0;padding:16px 20px;margin:24px 0}
        .mitos-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
        .mito-card,.verdade-card{background:var(--cor-branca);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:24px}
        .mito-card{border-left:4px solid var(--cor-perigo)}
        .mito-card .rotulo{color:var(--cor-perigo);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        .verdade-card{border-left:4px solid var(--cor-sucesso)}
        .verdade-card .rotulo{color:var(--cor-sucesso);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        .linha-do-tempo{margin:24px 0}
        .evento{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--cor-borda);align-items:start}
        .evento .ano{font-weight:700;color:var(--cor-primaria);font-size:.95rem}
        .evento .descricao{font-size:.95rem}
        .ias-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin:24px 0}
        .ia-card{background:var(--cor-branca);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:24px}
        .ia-card h3{margin-top:0;font-size:1.15rem}
        .ia-card .criador{color:var(--cor-texto-suave);font-size:.85rem;margin-bottom:10px}
        .ia-card .uso{font-size:.9rem;margin-bottom:10px}
        .ia-card .preco{display:inline-block;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--cor-primaria-clara);color:var(--cor-primaria-escura)}
        .tabela-comparativa{width:100%;border-collapse:collapse;margin:24px 0;font-size:.9rem}
        .tabela-comparativa th,.tabela-comparativa td{border:1px solid var(--cor-borda);padding:10px 14px;text-align:left}
        .tabela-comparativa th{background:var(--cor-primaria-clara);color:var(--cor-primaria-escura);font-weight:600}
        .tabela-comparativa tr:nth-child(even) td{background:var(--cor-fundo)}
        .dicas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:24px 0}
        .dica-card{background:var(--cor-branca);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:20px;text-align:center}
        .dica-card .dica-icone{font-size:2rem;margin-bottom:8px}
        .dica-card h3{font-size:1rem;margin-top:0}
        .dica-card p{font-size:.85rem;color:var(--cor-texto-suave);margin-bottom:0}
        .habilidades-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:24px 0}
        .habilidade-card{background:var(--cor-branca);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:20px}
        .habilidade-card h3{margin-top:0;font-size:1.05rem}
        .habilidade-card p{font-size:.9rem;color:var(--cor-texto-suave);margin-bottom:0}
        .btn-voltar{display:inline-block;margin-top:30px;padding:10px 22px;background:var(--cor-primaria);color:var(--cor-branca);text-decoration:none;border-radius:var(--raio);font-weight:500;font-size:.9rem;transition:background .15s}
        .btn-voltar:hover{background:var(--cor-primaria-escura)}
        @media(max-width:640px){.hero h1{font-size:1.7rem}.mitos-grid{grid-template-columns:1fr}.evento{grid-template-columns:1fr;gap:4px}.site-header .container{flex-direction:column}.site-nav{justify-content:center}.tabela-comparativa{font-size:.8rem}.tabela-comparativa th,.tabela-comparativa td{padding:6px 8px}}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">IA para Iniciantes</a>
            <nav class="site-nav">
                <a href="/o-que-e-ia">O que é IA</a>
                <a href="/mitos-e-verdades">Mitos e Verdades</a>
                <a href="/ia-como-ferramenta">IA como Ferramenta</a>
                <a href="/ias-famosas">IAs Famosas</a>
                <a href="/ia-mercado-trabalho">IA no Mercado</a>
            </nav>
        </div>
    </header>

    {% if breadcrumb %}
    <nav class="breadcrumb">
        <div class="container">
            <a href="/">Início</a>
            <span class="separator">&rsaquo;</span>
            <span>{{ breadcrumb }}</span>
        </div>
    </nav>
    {% endif %}

    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>IA para Iniciantes &mdash; Conteúdo educativo e gratuito para quem quer começar a entender Inteligência Artificial.</p>
        </div>
    </footer>
</body>
</html>
